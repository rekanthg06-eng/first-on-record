name: kaggle_status
# Prints the status (and, if finished, the log tail) of the image kernel. Diagnostic only.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: "${{ secrets.KAGGLE_API_TOKEN }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          pip install -q -U kaggle six
          echo '{"shots":[]}' > /tmp/j.json && python tools/kaggle/push_kernel.py /tmp/j.json k >/dev/null
          ref=$(python -c "import json;print(json.load(open('k/kernel-metadata.json'))['id'])")
          kaggle kernels status "$ref" 2>&1 | sed -E "s#$ref#KERNEL#"
          kaggle kernels list --mine --csv 2>&1 | cut -d, -f2- | head -5
          kaggle kernels output "$ref" -p out 2>&1 | tail -3 | sed -E "s#$ref#KERNEL#" || true
          ls -la out 2>/dev/null | head -50 || true
          tail -c 4000 out/*.log 2>/dev/null || true
