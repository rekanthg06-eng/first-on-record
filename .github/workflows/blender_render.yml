name: blender_render
# Renders a Blender (bpy, Cycles CPU) scene in parallel shards, stitches an mp4 (branch render-out), then runs the post stack
# (captions, pills, grain, loop blend, mix, loudnorm) from blender/<scene>/project/ and publishes the FINISHED Short to branch media as
# shorts/<scene>.mp4. No session has to stay alive: a scheduled upload task picks the result up.
on:
  workflow_dispatch:
    inputs:
      scene: { description: "folder name under blender/ (yyyymmdd-slug)", required: true }
      frames: { description: "total frames (must match scene.py)", required: true }
      shards: { description: "parallel shards (1-20)", required: true, default: "20" }
      fps: { description: "frames per second", required: true, default: "24" }
      post_only: { description: "true = skip rendering, only run post on the existing render-out mp4", required: false, default: "false" }

permissions:
  contents: write

jobs:
  plan:
    if: ${{ inputs.post_only != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, math, os
          n=int(os.environ["F"]); s=max(1,min(20,int(os.environ["S"]))); per=math.ceil(n/s)
          print("matrix="+json.dumps({"include":[{"i":i,"start":i*per+1,"end":min(n,(i+1)*per)} for i in range(s) if i*per<n]}))
          PY
        env: { F: "${{ inputs.frames }}", S: "${{ inputs.shards }}" }
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install bpy
      - name: Real-object assets (from fetch_assets.yml, if the scene uses any)
        run: |
          scene=$(echo "${{ inputs.scene }}" | tr -cd 'a-zA-Z0-9_-')
          if [ -f "blender/$scene/assets.json" ]; then
            git fetch -q --depth 1 origin assets-out
            mkdir -p "blender/$scene/assets"
            git archive FETCH_HEAD "assets/$scene" | tar -x --strip-components=2 -C "blender/$scene/assets"
            ls -l "blender/$scene/assets"
          fi
      - name: Render shard (one automatic retry)
        run: |
          scene=$(echo "${{ inputs.scene }}" | tr -cd 'a-zA-Z0-9_-')
          for attempt in 1 2; do
            python tools/blender_render.py "blender/$scene" --start ${{ matrix.start }} --end ${{ matrix.end }} --out out && break
            echo "shard failed, attempt $attempt"; [ $attempt = 2 ] && exit 1; sleep 20
          done
      - uses: actions/upload-artifact@v4
        with: { name: "shard-${{ matrix.i }}", path: out, retention-days: 2 }
  stitch:
    needs: render
    runs-on: ubuntu-latest
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: shards, pattern: "shard-*", merge-multiple: true }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          [ "$(ls shards | wc -l)" = "${{ inputs.frames }}" ] || { echo "frame count mismatch"; exit 1; }
          ffmpeg -loglevel error -framerate ${{ inputs.fps }} -pattern_type glob -i 'shards/f*.png' -c:v libx264 -pix_fmt yuv420p -crf 18 out.mp4
      - name: Publish to render-out
        run: |
          scene=$(echo "${{ inputs.scene }}" | tr -cd 'a-zA-Z0-9_-')
          mkdir pub && cd pub && git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin render-out >/dev/null 2>&1; then
            git fetch -q --depth 1 origin render-out && git checkout -q -b render-out FETCH_HEAD
          else git checkout -q --orphan render-out; fi
          mkdir -p render && cp ../out.mp4 "render/$scene.mp4"
          ls -1t render | tail -n +4 | sed 's#^#render/#' | xargs -r rm -f
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "render: $scene"
          git push -q origin render-out
  post:
    needs: [stitch]
    if: ${{ !cancelled() && (needs.stitch.result == 'success' || inputs.post_only == 'true') }}
    runs-on: ubuntu-latest
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Post stack
        run: |
          scene=$(echo "${{ inputs.scene }}" | tr -cd 'a-zA-Z0-9_-')
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          [ -d "blender/$scene/project" ] || { echo "missing blender/$scene/project"; exit 1; }
          git fetch -q --depth 1 origin render-out
          mkdir work && cp -r "blender/$scene/project/." work/
          git show FETCH_HEAD:render/$scene.mp4 > work/render.mp4
          cd work && bash "$GITHUB_WORKSPACE/tools/post/finish.sh"
          ls -l final.mp4
      - name: Publish to media
        run: |
          scene=$(echo "${{ inputs.scene }}" | tr -cd 'a-zA-Z0-9_-')
          mkdir pub && cd pub && git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin media && git checkout -q -b media FETCH_HEAD
          mkdir -p shorts && cp ../work/final.mp4 "shorts/$scene.mp4"
          for f in shorts/*.mp4; do [ "$f" = "shorts/$scene.mp4" ] || git rm -q "$f"; done
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "media: $scene (finished by blender_render)"
          git push -q origin media
