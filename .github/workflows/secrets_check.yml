name: secrets_check
# Verifies the ops secrets without printing them: YouTube OAuth (Data + Analytics) and the Kaggle API token.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: youtube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          EXPECTED_CHANNEL_ID: UCiAROWbI0PMJ-fYzUwTBdmQ
        run: python tools/ops/yt_api.py check
      - name: kaggle
        if: always()
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then echo "FAIL: KAGGLE_API_TOKEN secret missing"; exit 1; fi
          pip install -q -U kaggle six
          kaggle --version
          kaggle kernels list --mine --page-size 1 >/dev/null && echo "OK: Kaggle API token works"
