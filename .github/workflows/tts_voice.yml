name: tts_voice
# Open-source narration (Chatterbox, MIT) on a free GitHub runner, so the sandbox needs no model or key.
# A run stages tts/requests/<slug>.json on main -> this job -> branch tts-out gets tts/<slug>/{voice.wav,words.json,meta.json}.
# Output goes to a different branch so it never re-triggers this workflow. Keeps the 8 newest slugs.
on:
  push:
    branches: [main]
    paths: ['tts/requests/*.json']
  workflow_dispatch:
    inputs:
      request_path:
        description: Request json path(s), space-separated (default = newest in tts/requests)
        default: ''

concurrency:
  group: tts-voice
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      HF_HOME: ${{ github.workspace }}/.hf
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: tools/tts_requirements.txt }
      - uses: actions/cache@v4
        with: { path: .hf, key: hf-chatterbox-whisper-v1 }
      - name: Pick requests
        id: pick
        env:
          WANT: ${{ inputs.request_path }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$WANT" ]; then reqs="$WANT"
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$'; then
            reqs=$(git diff --no-renames --name-only --diff-filter=AM "$BEFORE" "${{ github.sha }}" -- 'tts/requests/*.json')
          else reqs=$(ls -1 tts/requests/*.json | sort | tail -n 1); fi
          [ -n "$reqs" ] || { echo "No request found."; exit 1; }
          echo "reqs=$(echo $reqs)" >> "$GITHUB_OUTPUT"; echo "Requests: $reqs"
      - name: Install
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu   # chatterbox pins 2.6.0; CPU wheels avoid the CUDA download
          pip install -q -r tools/tts_requirements.txt
      - name: Synthesize and time
        run: python tools/tts_remote.py ${{ steps.pick.outputs.reqs }} --out build/tts
      - name: Publish to tts-out
        run: |
          mkdir tts_out && cd tts_out && git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin tts-out >/dev/null 2>&1; then
            git fetch -q --depth 1 origin tts-out && git checkout -q -b tts-out FETCH_HEAD
          else
            git checkout -q --orphan tts-out
          fi
          mkdir -p tts && cp -r ../build/tts/* tts/
          ls -1d tts/*/ | sort | head -n -8 | xargs -r rm -rf     # keep the 8 newest (slugs start with yyyymmdd)
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "tts: $(ls ../build/tts | tr '\n' ' ')" || { echo "nothing to commit"; exit 0; }
          git push -q origin tts-out
